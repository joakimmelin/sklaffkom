# smsimport.conf
#
# ModemManager indices (Modem/0, Modem/1, ...) may change, so IMEI is
# the preferred way to identify the physical modem. If IMEI is empty,
# smsimport only proceeds when exactly one modem is available.

IMEI="863781014456421"

# Root of the SklaffKOM SMS spool. smsimport uses:
#   $SMS_DIR/incoming
#   $SMS_DIR/processed
#   $SMS_DIR/failed
SMS_DIR="/usr/local/sklaff/db/sms"
